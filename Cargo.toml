[package]
name = "keystone"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
serde = { version = "1.0.229", features = ["derive"] }

[target."cfg(windows)".dependencies]
windows-capture = "2"

# Linux is only used for development (calibration pattern, no capture).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
strip = true

# The `windows` bindings crate is huge; full optimisation of it needs more RAM than
# the small build box has, and its thin wrappers gain nothing from it.
[profile.release.package.windows]
opt-level = 1
codegen-units = 16
